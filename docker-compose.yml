services:
  journal:
    build: .
    environment:
      DB_PATH: /data/journal.db
      LISTEN_ADDR: :8080
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      BASE_URL: ${BASE_URL:-https://journal.example.com}
      SITE_NAME: ${SITE_NAME:-Journal}
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:?set OPERATOR_CONTACT}
      DATA_DIR: /data
      METRICS_ADDR: 127.0.0.1:9091
      LJ_SOURCE: ${LJ_SOURCE:-xmlrpc}
      USERPIC_DIR: /data/userpics
      IMAGE_CACHE_DIR: /data/images
    volumes:
      - journal-data:/data
    expose:
      - "8080"
    mem_limit: 512m
    cpus: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-journal.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - journal
    restart: unless-stopped
volumes:
  journal-data:
  caddy-data:
  caddy-config:
